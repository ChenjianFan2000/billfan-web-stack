# Loaded inside nginx's http context. Deliberately omit query strings from logs.
log_format dankou_vote '$remote_addr $time_iso8601 "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

map $uri $dankou_vote_cache_control {
    default "no-store";
    ~*\.(?:js|css)$ "no-cache";
    ~*\.(?:jpg|jpeg|png|webp|svg|ico|woff2)$ "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name vote.billfan.cn;
    access_log /var/log/nginx/dankou-vote.access.log dankou_vote;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://vote.billfan.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vote.billfan.cn;

    ssl_certificate /etc/letsencrypt/live/vote.billfan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vote.billfan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DankouVoteSSL:1m;
    ssl_session_timeout 1d;

    root /opt/dankou-vote/current/services/vote/static;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/dankou-vote.access.log dankou_vote;
    error_log /var/log/nginx/dankou-vote.error.log warn;

    add_header Cache-Control $dankou_vote_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # One persistent SSE stream per visible page; the application batches chat.
    # Do not add per-IP request throttling here: spectators may share one Wi-Fi IP.
    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        gzip off;
        access_log off;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = /players {
        try_files /players.html =404;
    }

    # Conditional requests keep releases fresh without downloading unchanged files.
    # HTML is never stored; admin access is authorized by the API, not by this file.
    location ~* \.html$ {
        try_files $uri =404;
    }

    location ~* \.(?:js|css)$ {
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2)$ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
