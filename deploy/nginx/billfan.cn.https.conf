server {
    listen 80;
    listen [::]:80;
    server_name www.billfan.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 http://billfan.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name billfan.cn;
    client_max_body_size 120m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    root /var/www/dist;
    index index.html;

    location = /aimath {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location ^~ /aimath/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location = /api/aimath {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location ^~ /api/aimath/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billfan.cn;
    client_max_body_size 120m;

    ssl_certificate /etc/letsencrypt/live/billfan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billfan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    root /var/www/dist;
    index index.html;

    location = /aimath {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location ^~ /aimath/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location = /api/aimath {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location ^~ /api/aimath/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location / {
        try_files $uri /index.html;
    }
}

