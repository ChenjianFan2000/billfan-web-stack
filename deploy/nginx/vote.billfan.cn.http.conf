# Temporary ACME bootstrap only. Never serve the voting API over plaintext HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name vote.billfan.cn;
    access_log off;
    client_max_body_size 64k;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 60 always;
        default_type text/plain;
        return 503 "HTTPS certificate setup is in progress. Please retry shortly.\n";
    }
}
