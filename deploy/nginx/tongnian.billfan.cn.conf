server {
    listen 80;
    listen [::]:80;
    server_name tongnian.billfan.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://tongnian.billfan.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tongnian.billfan.cn;

    ssl_certificate /etc/letsencrypt/live/tongnian.billfan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tongnian.billfan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
    }

    root /var/www/tongnian;
    index index.html;

    # README 中手机读稿使用 line-story/ 前缀，保持可用
    location = /line-story {
        return 301 https://tongnian.billfan.cn/;
    }

    location ^~ /line-story/ {
        alias /var/www/tongnian/;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
